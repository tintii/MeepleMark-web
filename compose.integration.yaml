services:
  test-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: meeplemark_test
      POSTGRES_USER: meeplemark_test
      POSTGRES_PASSWORD: integration-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meeplemark_test -d meeplemark_test"]
      interval: 1s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data

